name: Auto-Sync Documentation

on:
  schedule:
    - cron: '0 4 * * *' # Run daily at 04:00 UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: hermes-documentation-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Verify Maintenance Code
        run: |
          bash -n scripts/install-skill.sh scripts/sync-docs.sh
          python3 -m unittest discover -s tests -v

      - name: Sync and Validate Documentation
        run: |
          bash scripts/sync-docs.sh
          python3 scripts/validate_repository.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add references/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync documentation [$(date +%Y-%m-%d)]"
            git push origin HEAD:main
          fi
